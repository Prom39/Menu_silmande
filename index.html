<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Sopatel Silmandé — Menu digital</title>
<style>
  :root{
    --navy: #1F3A5F;
    --navy-dark: #12233B;
    --clay: #A9764E;
    --clay-light: #C99568;
    --gold: #BE9B4F;
    --cream: #FBF7F0;
    --cream-2: #F3ECE0;
    --charcoal: #24262B;
    --line: rgba(31,58,95,0.14);
    --serif: "Iowan Old Style","Palatino Linotype","URW Palladio L", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  html, body{overflow-x:hidden; max-width:100%;}
  body{
    margin:0; background:var(--cream); color:var(--charcoal);
    font-family:var(--sans); line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; display:block;}

  /* ---- diamond motif (signature), inspired by the bogolan-pattern bar counter at Wango Beli ---- */
  .diamond-rule{
    height:14px; width:100%; margin:0 auto;
    background-image: linear-gradient(45deg, transparent 45%, var(--gold) 45%, var(--gold) 55%, transparent 55%),
                       linear-gradient(-45deg, transparent 45%, var(--gold) 45%, var(--gold) 55%, transparent 55%);
    background-size: 14px 14px;
    background-position: center;
    background-repeat: repeat-x;
    opacity:0.55;
  }
  .diamond-rule.dense{background-size:10px 10px;}

  /* ---- header ---- */
  header.site{
    position:sticky; top:0; z-index:50;
    background:var(--cream); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand img{height:38px; width:auto;}
  .brand-text{font-family:var(--serif); font-size:15px; letter-spacing:0.02em; color:var(--navy); line-height:1.1;}
  .brand-text small{display:block; font-family:var(--sans); font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--clay); margin-top:2px;}

  .lang-toggle{
    border:1px solid var(--navy); background:transparent; color:var(--navy);
    font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:0.06em;
    padding:7px 14px; border-radius:999px; cursor:pointer;
  }
  .lang-toggle:active{background:var(--navy); color:#fff;}
  .lang-toggle:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---- hero ---- */
  .hero{position:relative; overflow:hidden; background:var(--navy-dark);}
  .hero img{width:100%; height:56vh; min-height:280px; max-height:460px; object-fit:cover; opacity:0.78;}
  .hero::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,20,34,0.45) 0%, rgba(10,20,34,0.58) 40%, rgba(10,20,34,0.82) 70%, rgba(10,20,34,0.96) 100%);
  }
  .hero-content{
    position:absolute; left:0; right:0; bottom:0; padding:30px 22px 24px;
    color:#fff; text-align:center; z-index:2;
  }
  .hero-content h1{
    font-family:var(--serif); font-weight:400; font-size:clamp(26px,6vw,40px);
    margin:0 0 10px; letter-spacing:0.01em; color:#FFFFFF;
    text-shadow:0 2px 10px rgba(0,0,0,0.55), 0 1px 2px rgba(0,0,0,0.6);
  }
  .hero-content p{
    margin:0 auto; font-size:14px; color:#F5F1E7; max-width:440px;
    text-shadow:0 1px 6px rgba(0,0,0,0.55);
  }

  /* ---- tabs ---- */
  .tabs{
    display:flex; max-width:640px; margin:0 auto; position:relative; top:-22px;
    background:var(--cream); border-radius:14px; box-shadow:0 6px 24px rgba(18,35,59,0.14);
    padding:6px; gap:6px;
  }
  .tab{
    flex:1; text-align:center; padding:12px 8px; border:none; background:transparent;
    font-family:var(--sans); font-size:13.5px; font-weight:600; letter-spacing:0.03em;
    color:var(--navy); border-radius:10px; cursor:pointer;
  }
  .tab.active{background:var(--navy); color:#fff;}
  .tab:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  main{max-width:640px; margin:0 auto; padding:0 18px 60px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- menu sections ---- */
  .section-title{
    font-family:var(--serif); font-size:22px; color:var(--navy); margin:34px 0 4px;
    text-align:center; font-weight:400;
  }
  .section-sub{text-align:center; font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--clay); margin-bottom:14px;}

  .menu-item{
    display:flex; gap:12px; padding:14px 2px; border-bottom:1px dashed var(--line);
    min-width:0;
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item img{
    width:64px; height:64px; border-radius:10px; object-fit:cover; flex-shrink:0;
    box-shadow:0 2px 8px rgba(18,35,59,0.18);
  }
  .menu-item .no-img{width:0;}
  .item-main{flex:1; min-width:0;}
  .item-head{display:flex; align-items:baseline; gap:8px; min-width:0;}
  .item-name{font-family:var(--serif); font-size:16px; color:var(--charcoal); min-width:0; overflow-wrap:break-word;}
  .item-leader{flex:1; border-bottom:1px dotted var(--line); margin-bottom:4px; min-width:8px;}
  .item-price{font-family:var(--sans); font-size:14px; font-weight:700; color:var(--navy); white-space:nowrap; flex-shrink:0;}
  .item-desc{font-size:12.5px; color:#5B5E63; margin-top:2px;}

  /* ---- hotel view ---- */
  .breakfast-card{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff; border-radius:16px; padding:20px; margin-top:22px; text-align:center;
  }
  .breakfast-card h3{font-family:var(--serif); font-weight:400; font-size:19px; margin:0 0 8px; color:#F3ECE0;}
  .breakfast-card p{font-size:13px; color:#D9D2C4; margin:0; line-height:1.6;}

  .services-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
  .service-card{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 12px; text-align:center;
  }
  .service-card .icon{
    width:38px; height:38px; margin:0 auto 8px; border-radius:50%;
    background:var(--cream-2); display:flex; align-items:center; justify-content:center;
    color:var(--clay);
  }
  .service-card h4{font-family:var(--serif); font-size:14.5px; margin:0 0 3px; color:var(--navy); font-weight:400;}
  .service-card p{font-size:11.5px; color:#6A6D72; margin:0;}

  .gallery{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:14px;}
  .gallery img{width:100%; height:88px; object-fit:cover; border-radius:8px;}

  .contact-block{margin-top:30px; text-align:center; padding:20px 10px; border-top:1px solid var(--line);}
  .contact-block h3{font-family:var(--serif); font-size:18px; color:var(--navy); font-weight:400; margin:0 0 6px;}
  .contact-block p{font-size:13px; color:#5B5E63; margin:2px 0;}
  .contact-block .note{font-size:11px; color:#9B9E9E; font-style:italic; margin-top:6px;}

  footer{
    text-align:center; padding:22px 18px 34px; color:#8B8E8C; font-size:11px;
  }
  footer .credit{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:8px; opacity:0.85;}
  footer .credit img{height:16px; width:auto;}

  @media (min-width:640px){
    .services-grid{grid-template-columns:repeat(3,1fr);}
  }

  @media (prefers-reduced-motion:no-preference){
    .view.active .menu-item, .view.active .service-card{animation:fadeUp 0.35s ease both;}
  }
  @keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
</style>
</head>
<body>

<header class="site">
  <div class="brand">
    <img id="logo-silmande" alt="Sopatel Silmandé">
    <div class="brand-text" id="brand-text"></div>
  </div>
  <button class="lang-toggle" id="lang-btn" aria-label="Changer de langue">EN</button>
</header>

<div class="hero">
  <img id="hero-img" alt="">
  <div class="hero-content">
    <h1 id="hero-title"></h1>
    <p id="hero-sub"></p>
  </div>
</div>

<div class="diamond-rule" style="position:relative; top:-14px;"></div>

<div class="tabs">
  <button class="tab active" id="tab-menu" data-view="menu"></button>
  <button class="tab" id="tab-hotel" data-view="hotel"></button>
</div>

<main>
  <section class="view active" id="view-menu"></section>
  <section class="view" id="view-hotel"></section>
</main>

<footer>
  <div id="footer-note"></div>
  <div class="credit">
    <span id="footer-credit-label"></span>
    <img id="logo-promethee" alt="Promethee Technologies">
  </div>
</footer>

    meeting: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="11" rx="1.5"/><path d="M3 11h18"/></svg>'
  };

  function img(key){ return IMAGES[key] || ''; }

  function renderMenu(d){
    const s = d.sections;
    let html = '';
    for (const key of ['entrees','plats','grillades','desserts','boissons']){
      const sec = s[key];
      html += `<h2 class="section-title">${sec.title}</h2><div class="diamond-rule dense" style="max-width:120px;"></div>`;
      html += '<div>';
      for (const it of sec.items){
        html += `<div class="menu-item">`;
        if (it.img) html += `<img src="${img(it.img)}" alt="${it.name}" loading="lazy">`;
        html += `<div class="item-main">
            <div class="item-head"><span class="item-name">${it.name}</span><span class="item-leader"></span><span class="item-price">${it.price}</span></div>
            <div class="item-desc">${it.desc}</div>
          </div></div>`;
      }
      html += '</div>';
    }
    return html;
  }

  function renderHotel(d){
    const h = d.hotel;
    let html = `<div class="breakfast-card"><h3>${h.breakfastTitle}</h3><p>${h.breakfastDesc}</p></div>`;
    html += `<h2 class="section-title">${h.servicesTitle}</h2><div class="diamond-rule dense" style="max-width:120px;"></div>`;
    html += '<div class="services-grid">';
    for (const sv of h.services){
      html += `<div class="service-card"><div class="icon">${ICONS[sv.icon]||''}</div><h4>${sv.name}</h4><p>${sv.desc}</p></div>`;
    }
    html += '</div>';
    html += `<h2 class="section-title">${h.galleryTitle}</h2><div class="diamond-rule dense" style="max-width:120px;"></div>`;
    html += '<div class="gallery">';
    for (const k of ['about_building','pool_day','bar_wango','beli_terrace','samandin_interior','entrance_night','buffet_viennoiseries','buffet_spread','buffet_desserts']){
      if (IMAGES[k]) html += `<img src="${img(k)}" alt="" loading="lazy">`;
    }
    html += '</div>';
    html += `<div class="contact-block"><h3>${h.contactTitle}</h3><p>${h.address}</p><p class="note">${h.contactNote}</p></div>`;
    return html;
  }

  function render(){
    const d = DATA[lang];
    document.documentElement.lang = lang;
    document.getElementById('brand-text').innerHTML = `${d.hotelName}<small>${d.tagline}</small>`;
    document.getElementById('hero-title').textContent = d.heroTitle;
    document.getElementById('hero-sub').textContent = d.heroSubtitle;
    document.getElementById('tab-menu').textContent = d.navMenu;
    document.getElementById('tab-hotel').textContent = d.navHotel;
    document.getElementById('lang-btn').textContent = d.langLabel;
    document.getElementById('view-menu').innerHTML = renderMenu(d);
    document.getElementById('view-hotel').innerHTML = renderHotel(d);
    document.getElementById('footer-note').textContent = '\u00A9 ' + d.hotelName + ' — ' + (lang==='fr' ? 'Prototype de menu digital' : 'Digital menu prototype');
    document.getElementById('footer-credit-label').textContent = d.footerCredit;
  }

  document.getElementById('lang-btn').addEventListener('click', function(){
    lang = lang === 'fr' ? 'en' : 'fr';
    render();
  });

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-' + btn.dataset.view).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });

  document.getElementById('logo-silmande').src = img('logo_silmande');
  document.getElementById('hero-img').src = img('hero');
  document.getElementById('logo-promethee').src = img('logo_promethee');

  render();
})();
</script>
</body>
</html>
